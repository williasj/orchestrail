name: Bug Report
description: Report a problem with Orchestrail
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below.

  - type: input
    id: orchestrail-version
    attributes:
      label: Orchestrail Version
      description: Found in package.json or the admin UI footer
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Docker version or Node.js version (`node --version`)
      placeholder: "Docker 26.1.0 / Node.js v20.11.0"
    validations:
      required: true

  - type: input
    id: ollama-model
    attributes:
      label: Ollama Model
      description: Model name and quantization (no endpoint URLs needed)
      placeholder: "llama3.2 / mistral:7b / qwen2.5-coder:7b"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Configure agent roster with...
        2. Send request to /v1/chat/completions with...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Include timestamps. Redact any IPs or credentials.
      render: shell
